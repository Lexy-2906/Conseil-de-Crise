<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conseil de Crise — Arrowverse Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131c2e;
            --accent-green: #00ff66;
            --accent-red: #ff3366;
            --accent-blue: #00e5ff;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #1a2744 0%, var(--bg-color) 70%);
        }

        .container {
            width: 90%;
            max-width: 850px;
            background: var(--panel-bg);
            border: 2px solid rgba(0, 229, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
            padding: 30px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .health-container {
            flex-grow: 1;
            margin: 0 20px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            height: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            transition: width 0.5s ease, background 0.5s ease;
        }

        .scenario-box {
            margin-bottom: 30px;
            text-align: center;
        }

        .scenario-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.4rem;
            color: var(--accent-green);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .scenario-desc {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-blue);
        }

        .choices-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.2);
        }

        .choice-tag {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
        }

        .feedback-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .feedback-box.active {
            display: block;
        }

        .feedback-text {
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .next-btn {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            display: block;
            margin: 0 auto;
        }

        .next-btn:hover {
            background: #00b4d8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Conseil de Crise : Star City</h1>
            <p class="subtitle">Jeu interactif pour Live TikTok (Mode Consensus)</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item" id="round-indicator">Manche 1 / 5</div>
            <div class="health-container">
                <div class="health-bar" id="health-bar"></div>
            </div>
            <div class="stat-item" id="health-text">100%</div>
        </div>

        <div id="game-area">
            <div class="scenario-box">
                <div class="scenario-title" id="scenario-title">Chargement...</div>
                <div class="scenario-desc" id="scenario-desc">Préparation du conseil de crise.</div>
            </div>

            <div class="choices-container" id="choices-container">
                <!-- Les boutons de choix seront injectés ici -->
            </div>
        </div>

        <div class="feedback-box" id="feedback-box">
            <div class="feedback-text" id="feedback-text"></div>
            <button class="next-btn" id="next-btn" onclick="nextScenario()">Scénario Suivant</button>
        </div>
    </div>

    <script>
        const scenarios = [
            {
                title: "Panne générale aux laboratoires S.T.A.R.",
                desc: "Un sabotage coupe l'alimentation principale. Le confinement du pipeline contenant de l'énergie noire lâche. Que doit faire l'équipe ?",
                choiceA: {
                    text: "1. Envoyer Cisco et Frost réparer manuellement au risque d'une exposition aux radiations.",
                    impactHealth: -15,
                    feedback: "Cisco et Frost réparent le système in extremis, mais l'exposition laisse des séquelles temporaires à Frost ! La ville est sauvée pour l'instant (-15% de santé)."
                },
                choiceB: {
                    text: "2. Activer la purge d'urgence de secours et sacrifier une aile entière du laboratoire.",
                    impactHealth: -30,
                    feedback: "La purge évite le pire, mais une partie des données de Flashpoint est perdue à jamais et les dégâts matériels pèsent lourd (-30% de santé)."
                }
            },
            {
                title: "Incursion de la pègre de Gotham",
                desc: "Des criminels armés de technologie de la Ligue des Assassins débarquent dans les bas-fonds de Star City. Le service de police est débordé.",
                choiceA: {
                    text: "1. Déployer l'équipe Arrow en solo pour nettoyer le quartier de nuit en mode discret.",
                    impactHealth: -10,
                    feedback: "Mission accomplie sans civils touchés, mais l'équipe encaisse quelques coups durs lors des affrontements au corps à corps (-10% de santé)."
                },
                choiceB: {
                    text: "2. Faire appel en urgence à l'A.R.G.U.S. pour boucler tout le secteur avec des forces lourdes.",
                    impactHealth: -25,
                    feedback: "L'A.R.G.U.S. règle ça radicale, mais la population panique face au déploiement militaire massif dans les rues (-25% de santé)."
                }
            },
            {
                title: "Le piège temporel de Reverse-Flash",
                desc: "Eobard Thawne perturbe le flux temporel, créant des failles qui font apparaître des éclairs instables au centre-ville.",
                choiceA: {
                    text: "1. Demander à Flash de courir dans le sens inverse pour sceller la brèche temporelle.",
                    impactHealth: -20,
                    feedback: "Barry réussit l'impossible, mais la surcharge d'énergie cinétique provoque une onde de choc qui brise les vitres du centre-ville (-20% de santé)."
                },
                choiceB: {
                    text: "2. Utiliser le perturbateur tachyonique de Cisco au risque de bloquer Barry hors de notre chronologie.",
                    impactHealth: -35,
                    feedback: "Le perturbateur fonctionne, mais Barry se retrouve piégé quelques heures dans la Speed Force, laissant la ville sans protecteur (-35% de santé)."
                }
            },
            {
                title: "Alerte Toxine au Verdant",
                desc: "Une bonbonne de gaz soporifique instable a été déposée dans le repaire secret. Le temps presse pour évacuer.",
                choiceA: {
                    text: "1. Ventiler immédiatement à l'air libre en ouvrant toutes les issues de secours secrètes.",
                    impactHealth: -10,
                    feedback: "L'air s'échappe rapidement, mais un quartier résidentiel voisin est légèrement incommodé par les fumées résiduelles (-10% de santé)."
                },
                choiceB: {
                    text: "2. Utiliser un neutralisant chimique expérimental sans tester les effets secondaires.",
                    impactHealth: -25,
                    feedback: "Le gaz est neutralisé net, mais la réaction chimique dégage une chaleur intense qui détruit une partie des archives de l'équipe (-25% de santé)."
                }
            },
            {
                title: "L'ultimatum final de Star City",
                desc: "Un syndicat criminel menace de faire sauter les barrages hydroélectriques si l'équipe ne se rend pas publiquement.",
                choiceA: {
                    text: "1. Tenter un assaut furtif coordonné par les toits pour neutraliser les preneurs d'otages.",
                    impactHealth: -15,
                    feedback: "Coup de maître de l'équipe ! Les otages sont libérés et le barrage est sécurisé de justesse (-15% de santé)."
                },
                choiceB: {
                    text: "2. Accepter de négocier et céder une partie des serveurs cryptés de la ville.",
                    impactHealth: -30,
                    feedback: "Les criminels libèrent la zone mais empochent des données stratégiques ultrasensibles pour la sécurité future (-30% de santé)."
                }
            }
        ];

        let currentScenarioIndex = 0;
        let cityHealth = 100;

        const titleEl = document.getElementById('scenario-title');
        const descEl = document.getElementById('scenario-desc');
        const choicesContainer = document.getElementById('choices-container');
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackText = document.getElementById('feedback-text');
        const healthBar = document.getElementById('health-bar');
        const healthText = document.getElementById('health-text');
        const roundIndicator = document.getElementById('round-indicator');
        const nextBtn = document.getElementById('next-btn');

        function loadScenario() {
            if (currentScenarioIndex >= scenarios.length || cityHealth <= 0) {
                endGame();
                return;
            }

            const current = scenarios[currentScenarioIndex];
            roundIndicator.innerText = `Manche ${currentScenarioIndex + 1} / ${scenarios.length}`;
            titleEl.innerText = current.title;
            descEl.innerText = current.desc;
            feedbackBox.classList.remove('active');

            choicesContainer.innerHTML = `
                <button class="choice-btn" onclick="makeChoice('A')">
                    <span class="choice-tag">Option 1</span>
                    <span>${current.choiceA.text.substring(3)}</span>
                </button>
                <button class="choice-btn" onclick="makeChoice('B')">
                    <span class="choice-tag">Option 2</span>
                    <span>${current.choiceB.text.substring(3)}</span>
                </button>
            `;
            choicesContainer.style.display = 'grid';
        }

        function makeChoice(option) {
            const current = scenarios[currentScenarioIndex];
            const choiceData = option === 'A' ? current.choiceA : current.choiceB;

            cityHealth += choiceData.impactHealth;
            if (cityHealth < 0) cityHealth = 0;
            if (cityHealth > 100) cityHealth = 100;

            updateHealthUI();

            choicesContainer.style.display = 'none';
            feedbackText.innerText = choiceData.feedback;
            feedbackBox.classList.add('active');

            if (currentScenarioIndex === scenarios.length - 1 || cityHealth <= 0) {
                nextBtn.innerText = "Voir le Bilan Final";
            }
        }

        function updateHealthUI() {
            healthBar.style.width = cityHealth + '%';
            healthText.innerText = cityHealth + '%';
            if (cityHealth < 30) {
                healthBar.style.background = 'var(--accent-red)';
            } else {
                healthBar.style.background = 'linear-gradient(90deg, var(--accent-green), var(--accent-blue))';
            }
        }

        function nextScenario() {
            currentScenarioIndex++;
            loadScenario();
        }

        function endGame() {
            document.getElementById('game-area').style.display = 'none';
            feedbackBox.classList.add('active');
            
            let message = "";
            if (cityHealth > 50) {
                message = `🏆 **Victoire éclatante !** La ville a survécu à la crise avec ${cityHealth}% de intégrité. Le chat a assuré la gestion de Star City comme de vrais héros !`;
            } else if (cityHealth > 0) {
                message = `⚠️ **Sauvetage de justesse !** Star City est en ruines (${cityHealth}% d'intégrité), mais les habitants sont vivants. Il faudra redoubler de vigilance au prochain live !`;
            } else {
                message = `💀 **Défaite critique !** La jauge de la ville est tombée à 0%. Star City a succombé aux catastrophes...`;
            }

            feedbackText.innerHTML = `<h3 style="color: var(--accent-blue); margin-bottom: 10px;">Fin de la session !</h3><p>${message}</p>`;
            nextBtn.style.display = 'none';
        }

        // Lancement initial
        loadScenario();
    </script>
</body>
</html>
